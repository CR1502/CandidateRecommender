[project]
name = "candidate-recommender"
version = "2.0.0"
description = "Rank and assess job candidates against a job description using local AI models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # API server
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.2.0",
    # Embeddings & ML
    "sentence-transformers>=2.7.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    # Ollama (local LLM) is called over HTTP; enrichment fetches public profiles
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    # File parsing
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "chardet>=5.2.0",
    # Utilities
    "loguru>=0.7.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "httpx2>=2.0.0", # required by fastapi.testclient
    "ruff>=0.16.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/candidate_recommender"]

# CPU-only PyTorch on Linux (Docker, CI): the default PyPI wheel bundles CUDA
# and is several GB. macOS/Windows use PyPI as normal.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501", # long lines: left to the formatter
    "B008", # FastAPI's File()/Form()/Depends() defaults are idiomatic
]

[tool.ruff.lint.isort]
known-first-party = ["candidate_recommender"]
